
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="bg" x2="0" y2="1">
      <stop stop-color="#160829"/>
      <stop offset="1" stop-color="#35105f"/>
    </linearGradient>
    <linearGradient id="purple">
      <stop stop-color="#a855f7"/>
      <stop offset=".5" stop-color="#7c3aed"/>
      <stop offset="1" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>

  <path fill="url(#purple)" opacity=".7">
    <animate attributeName="d" dur="6s" repeatCount="indefinite"
      values="
      M0 190 Q300 100 600 190 T1200 190 V320 H0Z;
      M0 190 Q300 270 600 190 T1200 190 V320 H0Z;
      M0 190 Q300 100 600 190 T1200 190 V320 H0Z"/>
  </path>

  <path fill="#9333ea" opacity=".55">
    <animate attributeName="d" dur="8s" repeatCount="indefinite"
      values="
      M0 230 Q300 150 600 230 T1200 230 V320 H0Z;
      M0 230 Q300 300 600 230 T1200 230 V320 H0Z;
      M0 230 Q300 150 600 230 T1200 230 V320 H0Z"/>
  </path>

  <text x="600" y="145" text-anchor="middle"
        font-family="Verdana,Arial,sans-serif"
        font-size="64" font-weight="bold" fill="#fff">
    Khaled Mohamed
  </text>

  <text x="600" y="178" text-anchor="middle"
        font-family="Verdana,Arial,sans-serif"
        font-size="13" letter-spacing="5" fill="#e9d5ff">
    CREATIVE • PERSONAL • UNIQUE
  </text>
</svg>
